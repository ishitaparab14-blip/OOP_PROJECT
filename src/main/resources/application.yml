server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: campusfind
  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

---
# ------------------ Local Development Profile (H2 In-Memory) ------------------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:campusfinddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

campusfind:
  seed-demo-data: true
  admin:
    name: "System Administrator"
    email: "admin@campusfind.edu"
    password: ${CAMPUSFIND_ADMIN_PASSWORD:Admin@123Password}

---
# ------------------ Production Deployment Profile (PostgreSQL Cloud) ------------------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campusfind}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

campusfind:
  seed-demo-data: false
  admin:
    name: "System Administrator"
    email: ${CAMPUSFIND_ADMIN_EMAIL:admin@campusfind.edu}
    password: ${CAMPUSFIND_ADMIN_PASSWORD:}
